name: Fetch translator files
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - translator/sources.json
      - .github/fetch_translator.py
      - .github/workflows/fetch-translator.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fetch_translator.py
      - name: Commit any new files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translator/
          if git diff --cached --quiet; then echo "nothing new"; else git commit -m "Add translator files (Firefox en-th model)" && git push; fi
